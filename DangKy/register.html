
<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đăng ký - GameZone</title>
    <link rel="stylesheet" href="register.css">
</head>
<body>

<div class="register-container">

    <div class="register-box">

        <a href="../TrangChu/index.html" class="logo">🎮 GAMEZONE</a>

        <h2>Tạo tài khoản mới</h2>
        <p>Tham gia cộng đồng GameZone ngay hôm nay!</p>

        <form id="registerForm">

            <label>Họ và tên</label>
            <input type="text" id="name"
                   placeholder="Nhập họ và tên" required>

            <label>Email</label>
            <input type="email" id="email"
                   placeholder="Nhập email" required>

            <label>Mật khẩu</label>
            <input type="password" id="password"
                   placeholder="Nhập mật khẩu" required minlength="6">

            <label>Nhập lại mật khẩu</label>
            <input type="password" id="confirmPassword"
                   placeholder="Nhập lại mật khẩu" required>

            <button type="submit">ĐĂNG KÝ</button>

        </form>

        <p class="login-link">
            Đã có tài khoản?
            <a href="../DangNhap/login.html">Đăng nhập</a>
        </p>

        <a href="../TrangChu/index.html" class="back">
            ← Quay lại trang chủ
        </a>

    </div>

</div>

<script src="register.js"></script>
</body>
</html>
